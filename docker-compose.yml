name: loxsuite

services:
  # Mosquitto runs inside this same container's docker-entrypoint.sh (gateway/Dockerfile) —
  # a single "loxsuite" container is all that shows up in `docker ps`/Docker Desktop, even
  # though the broker and the gateway are still two independent processes internally.
  loxsuite:
    build: ./gateway
    container_name: loxsuite
    restart: unless-stopped
    environment:
      MQTT_URL: mqtt://127.0.0.1:1883
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_ADMIN_USERNAME: ${MQTT_ADMIN_USERNAME:-admin}
      MQTT_ADMIN_PASSWORD: ${MQTT_ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DB_PATH: /data/gateway.db
      # SQLite (above) is the zero-config default — nothing else below is needed for it. To point
      # LoxSuite at an external PostgreSQL or MySQL/MariaDB server instead, set DB_BACKEND to
      # postgres or mysql and either DATABASE_URL or the discrete DB_HOST/DB_PORT/DB_NAME/DB_USER/
      # DB_PASSWORD vars (DB_PATH above is simply ignored then). See .env.example for the full list
      # (DB_SSL, DB_POOL_MAX, DB_CONNECT_TIMEOUT_MS/DB_CONNECT_RETRIES) and gateway/src/db/
      # transfer.js for moving an existing SQLite install's data over first.
      # DB_BACKEND: postgres
      # DATABASE_URL: postgres://loxsuite:changeme@postgres-host:5432/loxsuite
      # DB_BACKEND: mysql
      # DATABASE_URL: mysql://loxsuite:changeme@mysql-host:3306/loxsuite
      MOSQUITTO_LOG_PATH: /mosquitto/log/mosquitto.log
      MOSQUITTO_CONFIG_PATH: /mosquitto/config
      LOXONE_UDP_PORT: 11885
      PORT: 5582
      DEVICE_TEMPLATES_PATH: /device-templates
    volumes:
      - ./data:/data
      - ./mosquitto/config:/mosquitto/config
      - ./device-templates:/device-templates
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    ports:
      - "5582:5582"
      - "1883:1883"
      - "9001:9001"
      - "11885:11885/udp"

volumes:
  mosquitto_data:
  mosquitto_log:
