name: Build and publish Docker image

# Publishes to GHCR (ghcr.io/<owner>/loxsuite) rather than Docker Hub — no separate account/secret
# to set up, since it authenticates with the repo's own built-in GITHUB_TOKEN. This is also what
# the Unraid Community Applications template (unraid/loxsuite.xml) actually pulls, so this
# workflow existing and running is a prerequisite for that template working at all.
#
# One image build per release: only for a version tag (v*), not also for the push to main that comes
# with it — that built the same commit a second time (with its own test run, plus test.yml's). The tag's
# build also writes :latest, when that tag is where main is now (an older tag pushed later doesn't move
# :latest back). By hand (Actions → Run workflow, on main): a build of main with :latest.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

# One image build at a time, in the order they were pushed (a newer one waits, it doesn't cancel), so
# :latest ends up as the newest release.
concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/loxsuite

jobs:
  # Gate the image publish on the gateway's own test suite (same steps as test.yml). Until now the
  # two workflows ran independently, so a push to main that broke the tests still published a new
  # :latest straight to GHCR — the exact image the Unraid template pulls. A red test run now blocks
  # the publish instead of shipping a broken image to every install that auto-updates.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      # better-sqlite3 needs to compile its native binding from source on install.
      - run: sudo apt-get update && sudo apt-get install -y python3 make g++

      - run: npm ci

      - run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # :latest only when this commit is where main is now — a release (or a run by hand on main), not
      # an older tag pushed afterwards
      - id: latest
        run: |
          git fetch --no-tags --depth=1 origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      # Lets the amd64 GitHub-hosted runner cross-build the arm64 image below (see the
      # build-push-action's own `platforms:`) via QEMU user-mode emulation, rather than needing a
      # real arm64 runner. Slower than a native build (better-sqlite3's native binding, and every
      # apk package pulled into the final image, gets built/fetched for arm64 under emulation) but
      # otherwise unremarkable — GHA's own cache (cache-from/cache-to below) keeps repeat builds fast.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # :latest from the release that is where main is now (see the step above) — not from
          # {{is_default_branch}}, which is true for any tag on main: every tag pushed together used to
          # write :latest and the run that finished last won (v0.39.0 after pushing 0.36.4–0.41.0).
          tags: |
            type=raw,value=latest,enable=${{ steps.latest.outputs.ok == 'true' }}
            type=ref,event=tag
            type=sha,prefix=,format=short

      - uses: docker/build-push-action@v5
        with:
          context: ./gateway
          push: true
          # arm64 covers every 64-bit Raspberry Pi (3/4/5) running DietPi/Raspberry Pi OS — see
          # README's "Running on a Raspberry Pi" section — and any other arm64 SBC/NAS. Deliberately
          # NOT also building armv7 (32-bit): older Node/Alpine base image support for it is far
          # less consistently maintained, and every Pi capable of running this comfortably (3B+ and
          # later) already defaults to a 64-bit OS today, so the real-world benefit is small next to
          # doubling every build's already-longer (QEMU-emulated) compile time.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
